name: Book validation runtime
description: Install the pinned Python, Node, Quarto and Lean runtime and exercise infrastructure regressions
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.11"

    - name: Install pinned post-v2 evidence runtime
      shell: bash
      run: |
        python3 -m pip install --disable-pip-version-check --no-cache-dir \
          --index-url https://download.pytorch.org/whl/cpu torch==2.7.1
        python3 -m pip install --disable-pip-version-check --no-cache-dir \
          -r ci/post_v2_requirements.txt

    - name: Set up Node for infrastructure CLI controls
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: "22"

    - name: Set up Quarto
      uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
      with:
        version: "1.9.38"

    - name: Install Lean
      shell: bash
      run: |
        python3 scripts/install_lean_runtime.py --install --elan-home "$HOME/.elan"
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

    - name: Test validation infrastructure
      shell: bash
      run: python3 -m unittest discover -s tests -p "test_*.py"
