name: Build tested Pages artifact

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install publication validation runtime
        run: python3 -m pip install --disable-pip-version-check -r ci/publication_requirements.txt

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.9.38"

      - name: Install pinned browser runtime
        run: |
          npm ci --ignore-scripts --prefix ci/browser
          ./ci/browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Check generated scaffold
        run: python3 scripts/sync_scaffold.py --check

      - name: Validate book publication sources
        run: |
          python3 scripts/validate_book.py
          python3 scripts/validate_publication.py
          python3 scripts/validate_public_status_consistency.py
          python3 scripts/validate_source_appendices.py
          python3 scripts/validate_source_evidence_audit.py
          python3 scripts/validate_outline_consistency.py
          python3 scripts/validate_human_reader_current.py
          python3 scripts/validate_p7_1c_reader_prose_quality.py
          python3 scripts/validate_claim_atom_registry.py
          python3 scripts/validate_tested_artifact_deployment.py

      - name: Render clean HTML
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          rm -rf _site
          python3 scripts/admission_guard.py --run quarto render --to html
          python3 scripts/admission_guard.py --run quarto render editions/reader_manuscript/current --to html
          python3 scripts/build_human_reader_public_site.py --site _site
          python3 scripts/build_human_reader_public_site.py --site _site --check
          python3 scripts/admission_guard.py --run quarto render papers --to html
          python3 scripts/validate_paper_library.py --site _site

      - name: Build and validate canonical public status
        run: |
          python3 scripts/build_canonical_public_status.py --output _site/status/canonical-public-status.json
          python3 scripts/build_product_projections.py --output _site/products --status _site/status/canonical-public-status.json
          python3 scripts/build_release_channels.py --site _site
          python3 scripts/validate_product_projections.py --site _site
          python3 scripts/validate_release_channels.py --site _site --require-clean
          python3 scripts/validate_public_status_consistency.py --site _site --require-clean

      - name: Validate live Human view
        run: python3 scripts/validate_live_human_view.py

      - name: Browser-smoke live Human view
        env:
          NODE_PATH: ${{ github.workspace }}/ci/browser/node_modules
        run: |
          node scripts/validate_live_human_view_browser.js --strict --all-chapters --all-viewports
          python3 scripts/validate_live_human_view_browser_report.py --site _site

      - name: Build and verify tested artifact
        run: |
          python3 scripts/build_tested_site_bundle.py --site _site --output build/pages-tested
          python3 scripts/validate_tested_site_bundle.py --bundle build/pages-tested --expected-commit "$GITHUB_SHA"

      - name: Upload commit-bound tested artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-tested-${{ github.sha }}
          path: build/pages-tested
          if-no-files-found: error
          retention-days: 14

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-diagnostics-${{ github.workflow }}-${{ github.run_id }}
          path: |
            build/validation_registry_report.json
            build/validation_registry_report-outputs/
            build/publication-source-*/
            build/proof-envelope-compile-*/
            build/living-book-compile-*/
            build/proof_axiom_audit/
            build/live_human_view_browser_report.json
            build/edition-control-*.png
            build/failure-*.png
          if-no-files-found: ignore
          retention-days: 14
