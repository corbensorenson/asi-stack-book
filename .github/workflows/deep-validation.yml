name: Deep validation

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Set up validation runtime
        uses: ./.github/actions/validation-runtime

      - name: Run deep registry tier
        env:
          PYTHONPATH: ${{ github.workspace }}/ci/linux_mlx_preflight_stubs
        run: python3 scripts/run_validation_registry.py --tier deep

      - name: Preserve validation diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-diagnostics-${{ github.workflow }}-${{ github.run_id }}
          path: |
            build/validation_registry_report.json
            build/validation_registry_report-outputs/
            build/publication-source-*/
            build/proof-envelope-compile-*/
            build/living-book-compile-*/
            build/proof_axiom_audit/
            build/live_human_view_browser_report.json
            build/edition-control-*.png
            build/failure-*.png
          if-no-files-found: ignore
          retention-days: 14
