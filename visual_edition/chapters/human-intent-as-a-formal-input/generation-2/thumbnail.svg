<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Human Intent as a Formal Input</title>
  <desc id="desc">A cyan launch request separates into a delivered private draft and a blocked publication token at a gold authority gate, showing that desired outcome and permission are not the same.</desc>
  <rect width="1280" height="720" fill="#111F28"/>
  <text x="72" y="88" fill="#58B7D3" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">THE ASI STACK</text>
  <text x="72" y="157" fill="#F5F8FA" font-family="Avenir Next, Arial, sans-serif" font-size="58" font-weight="700">A request is not permission.</text>
  <text x="72" y="203" fill="#B8C4CC" font-family="Avenir Next, Arial, sans-serif" font-size="25">Human Intent as a Formal Input</text>

  <rect x="72" y="277" width="390" height="98" rx="18" fill="#17313A" stroke="#58B7D3" stroke-width="5"/>
  <text x="267" y="318" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, Arial, sans-serif" font-size="19" font-weight="700">PRIVATE NOTES · AMAZING LAUNCH</text>
  <text x="267" y="349" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">PUBLISH TODAY</text>

  <path d="M462 326 C532 326 541 254 606 254" fill="none" stroke="#62C370" stroke-width="7"/>
  <path d="M462 326 C532 326 541 467 606 467" fill="none" stroke="#F2C14E" stroke-width="7"/>
  <polygon points="606,254 587,244 587,264" fill="#62C370"/>
  <polygon points="606,467 587,457 587,477" fill="#F2C14E"/>

  <rect x="618" y="215" width="290" height="92" rx="16" fill="#172A34" stroke="#62C370" stroke-width="5"/>
  <text x="763" y="251" text-anchor="middle" fill="#62C370" font-family="Avenir Next, Arial, sans-serif" font-size="18" font-weight="700">CONTRACT V1</text>
  <text x="763" y="283" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">PRIVATE DRAFT</text>

  <rect x="618" y="426" width="290" height="92" rx="16" fill="#172A34" stroke="#D79A6B" stroke-width="5"/>
  <text x="763" y="462" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, Arial, sans-serif" font-size="18" font-weight="700">CONTRACT V2</text>
  <text x="763" y="494" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">EXPLICIT GRANT</text>

  <line x1="983" y1="371" x2="983" y2="585" stroke="#F2C14E" stroke-width="13"/>
  <line x1="1030" y1="371" x2="1030" y2="585" stroke="#F2C14E" stroke-width="13"/>
  <line x1="977" y1="371" x2="1036" y2="371" stroke="#F2C14E" stroke-width="13"/>
  <rect x="921" y="323" width="171" height="45" rx="11" fill="#182630" stroke="#F2C14E" stroke-width="3"/>
  <text x="1006" y="353" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="700">AUTHORITY GATE</text>

  <rect x="1090" y="441" width="143" height="67" rx="14" fill="#182630" stroke="#F45B69" stroke-width="5"/>
  <text x="1161" y="483" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="23" font-weight="700">PUBLISH</text>

  <rect x="618" y="574" width="474" height="62" rx="14" fill="#182630" stroke="#F2C14E" stroke-width="3"/>
  <text x="855" y="613" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="700">HELP NOW · POWER ONLY WHEN EXPLICIT</text>
</svg>
