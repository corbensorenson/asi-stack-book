<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">A goal needs a contract</title>
  <desc id="desc">A Rivergate objective packet points to a bounded lease while a red evidence boundary separates a proxy score from the target.</desc>
  <rect width="1280" height="720" fill="#0D1D26"/>
  <rect x="48" y="48" width="1184" height="624" rx="26" fill="#0F2029" stroke="#6B8790" stroke-width="3"/>
  <text x="88" y="130" fill="#F2BD63" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="700" letter-spacing="3">A GOAL NEEDS A CONTRACT</text>
  <text x="90" y="176" fill="#B8C8CE" font-family="Arial, Helvetica, sans-serif" font-size="24">Purpose, proxy, standing, and authority stay typed.</text>

  <rect x="94" y="278" width="276" height="174" rx="18" fill="#142934" stroke="#F2BD63" stroke-width="6"/>
  <rect x="114" y="252" width="206" height="38" rx="12" fill="#142934" stroke="#F2BD63" stroke-width="4"/>
  <text x="217" y="278" text-anchor="middle" fill="#F2BD63" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">RIVERGATE PACKET</text>
  <text x="232" y="354" text-anchor="middle" fill="#F2BD63" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">PURPOSE</text>
  <text x="232" y="394" text-anchor="middle" fill="#67D5F2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">TARGET v4</text>

  <path d="M370 365 H525" stroke="#66D58A" stroke-width="7" fill="none"/>
  <path d="M525 365 l-24 -16 v32 z" fill="#66D58A"/>
  <rect x="545" y="300" width="270" height="130" rx="18" fill="#142934" stroke="#66D58A" stroke-width="6"/>
  <text x="680" y="354" text-anchor="middle" fill="#66D58A" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">BOUNDED LEASE</text>
  <text x="680" y="392" text-anchor="middle" fill="#B8C8CE" font-family="Arial, Helvetica, sans-serif" font-size="21">scope · expiry · abstain</text>

  <path d="M815 365 H960" stroke="#67D5F2" stroke-width="7" fill="none"/>
  <path d="M960 365 l-24 -16 v32 z" fill="#67D5F2"/>
  <rect x="980" y="300" width="192" height="130" rx="18" fill="#142934" stroke="#67D5F2" stroke-width="6"/>
  <text x="1076" y="354" text-anchor="middle" fill="#67D5F2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">AUTHORITY</text>
  <text x="1076" y="390" text-anchor="middle" fill="#B8C8CE" font-family="Arial, Helvetica, sans-serif" font-size="20">OPEN</text>

  <rect x="94" y="510" width="278" height="72" rx="16" fill="#142934" stroke="#FF6073" stroke-width="5"/>
  <text x="233" y="556" text-anchor="middle" fill="#FF6073" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700">VISIBLE PROXY ↑</text>
  <path d="M389 546 H592" stroke="#FF6073" stroke-width="6" fill="none"/>
  <path d="M592 546 l-21 -14 v28 z" fill="#FF6073"/>
  <line x1="624" y1="480" x2="624" y2="610" stroke="#FF6073" stroke-width="7"/>
  <text x="665" y="536" fill="#FF6073" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">EVIDENCE CEILING</text>
  <text x="665" y="572" fill="#B8C8CE" font-family="Arial, Helvetica, sans-serif" font-size="20">proxy gain ≠ target gain</text>

  <rect x="1010" y="508" width="162" height="76" rx="16" fill="#142934" stroke="#9C82E8" stroke-width="5"/>
  <text x="1091" y="556" text-anchor="middle" fill="#9C82E8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">DISSENT</text>
</svg>
