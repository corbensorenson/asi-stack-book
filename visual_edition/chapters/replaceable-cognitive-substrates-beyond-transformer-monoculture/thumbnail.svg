<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Replaceable Cognitive Substrates</title>
  <desc id="desc">Transformer, state-space, recurrent, graph, and program-shaped kernels connect through one typed Cognitive Kernel ABI while authority and effects remain outside.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="70" y="105" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="53" font-weight="700">REPLACEABLE COGNITIVE SUBSTRATES</text>
  <text x="70" y="158" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="30">The Transformer is an implementation, not the interface</text>
  <g font-family="Avenir Next, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="75" y="240" width="190" height="100" rx="18" fill="#182630" stroke="#58B7D3" stroke-width="6"/><text x="170" y="302" fill="#58B7D3">TRANSFORMER</text>
    <rect x="315" y="240" width="170" height="100" rx="50" fill="#182630" stroke="#62C370" stroke-width="6"/><text x="400" y="302" fill="#62C370">SSM</text>
    <circle cx="610" cy="290" r="58" fill="#182630" stroke="#D79A6B" stroke-width="6"/><text x="610" y="299" fill="#D79A6B">RNN</text>
    <polygon points="770,235 855,290 770,345 685,290" fill="#182630" stroke="#D66BA0" stroke-width="6"/><text x="770" y="299" fill="#D66BA0">GRAPH</text>
    <rect x="900" y="240" width="240" height="100" fill="#182630" stroke="#F2C14E" stroke-width="6"/><text x="1020" y="302" fill="#F2C14E">PROGRAM</text>
  </g>
  <path d="M170 350 V445 M400 350 V445 M610 350 V445 M770 350 V445 M1020 350 V445" stroke="#8F9AA3" stroke-width="6"/>
  <rect x="150" y="445" width="930" height="115" rx="20" fill="#182630" stroke="#58B7D3" stroke-width="8"/>
  <text x="615" y="515" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, sans-serif" font-size="42" font-weight="700">COGNITIVE KERNEL ABI</text>
  <line x1="615" y1="560" x2="615" y2="625" stroke="#F45B69" stroke-width="10"/>
  <line x1="555" y1="625" x2="675" y2="625" stroke="#F45B69" stroke-width="12"/>
  <text x="820" y="640" fill="#F45B69" font-family="Avenir Next, sans-serif" font-size="28" font-weight="700">PROPOSAL ≠ EFFECT</text>
</svg>
