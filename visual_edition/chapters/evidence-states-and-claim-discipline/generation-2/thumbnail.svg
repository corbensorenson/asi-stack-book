<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Evidence States and Claim Discipline</title>
  <desc id="desc">A cyan retrieval claim approaches an amber evidence airlock. Eight evidence bars remain separate, with independence visibly weak, and a red PROVEN stamp is crossed out.</desc>
  <rect width="1280" height="720" fill="#14262F"/>
  <rect x="58" y="48" width="1164" height="624" rx="28" fill="#172A33" stroke="#314B57" stroke-width="3"/>
  <text x="92" y="116" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700">EVIDENCE STATES</text>
  <text x="92" y="162" fill="#F4C95D" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">WHAT DID THE EVIDENCE ACTUALLY TOUCH?</text>
  <rect x="92" y="238" width="436" height="188" rx="20" fill="#14262F" stroke="#5BC0D8" stroke-width="7"/>
  <text x="124" y="286" fill="#5BC0D8" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">MEMORY ADAPTER · VERSION 1</text>
  <text x="124" y="358" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700">RETRIEVAL +18%</text>
  <g transform="rotate(-8 492 238)">
    <rect x="392" y="194" width="202" height="74" rx="12" fill="#14262F" stroke="#EF5D6F" stroke-width="6"/>
    <text x="428" y="243" fill="#EF5D6F" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">PROVEN?</text>
    <path d="M406 207 L577 256 M577 207 L406 256" stroke="#EF5D6F" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g transform="translate(592 226)">
    <rect x="0" y="0" width="38" height="196" rx="8" fill="#14262F" stroke="#F4C95D" stroke-width="5"/>
    <rect x="104" y="0" width="38" height="196" rx="8" fill="#14262F" stroke="#F4C95D" stroke-width="5"/>
    <text x="19" y="250" fill="#F4C95D" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">AIRLOCK</text>
  </g>
  <g transform="translate(770 226)">
    <rect x="0" y="148" width="38" height="48" rx="6" fill="#EF5D6F" opacity="0.72"/>
    <rect x="50" y="48" width="38" height="148" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="100" y="28" width="38" height="168" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="150" y="54" width="38" height="142" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="200" y="38" width="38" height="158" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="250" y="34" width="38" height="162" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="300" y="44" width="38" height="152" rx="6" fill="#66C47C" opacity="0.78"/>
    <rect x="350" y="50" width="38" height="146" rx="6" fill="#66C47C" opacity="0.78"/>
    <text x="-1" y="224" fill="#EF5D6F" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">IND</text>
    <text x="51" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">REP</text>
    <text x="101" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">REC</text>
    <text x="151" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">COV</text>
    <text x="201" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">ADV</text>
    <text x="251" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">VAL</text>
    <text x="301" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">ACC</text>
    <text x="351" y="224" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="18">XFER</text>
  </g>
  <rect x="90" y="530" width="1098" height="90" rx="18" fill="#101D24" stroke="#F4C95D" stroke-width="3"/>
  <text x="640" y="586" text-anchor="middle" fill="#E9F2F5" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700">SEVEN STRONG DIMENSIONS CANNOT ERASE ONE MISSING SAFEGUARD</text>
</svg>
