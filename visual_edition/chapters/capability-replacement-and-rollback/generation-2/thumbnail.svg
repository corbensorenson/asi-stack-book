  <text x="640" y="100" text-anchor="middle" fill="#f2bd63" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700" letter-spacing="2">CAPABILITY REPLACEMENT</text>
  <text x="640" y="150" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="27">A transaction, not a pointer swap</text>
  <rect x="86" y="240" width="250" height="150" rx="18" fill="#142934" stroke="#67d5f2" stroke-width="5"/>
  <text x="211" y="306" text-anchor="middle" fill="#67d5f2" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">ROUTE A</text>
  <text x="211" y="348" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="20">prior · checkpoint</text>
  <path d="M365 315 H458" stroke="#f2bd63" stroke-width="8" fill="none"/>
  <path d="M448 299 L478 315 L448 331" fill="#f2bd63"/>
  <rect x="490" y="220" width="286" height="190" rx="18" fill="#142934" stroke="#f2bd63" stroke-width="5"/>
  <text x="633" y="280" text-anchor="middle" fill="#f2bd63" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">TRANSACTION DESK</text>
  <text x="633" y="322" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">identity · state · effects</text>
  <text x="633" y="352" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">authority · monitor · recovery</text>
  <text x="633" y="382" text-anchor="middle" fill="#ff6073" font-family="Arial,Helvetica,sans-serif" font-size="18">residuals stay visible</text>
  <path d="M804 267 H892 M804 365 H892" stroke="#9c82e8" stroke-width="7" fill="none"/>
  <path d="M882 251 L912 267 L882 283 M882 349 L912 365 L882 381" fill="#9c82e8"/>
  <rect x="928" y="214" width="252" height="218" rx="18" fill="#142934" stroke="#ff6073" stroke-width="5"/>
  <text x="1054" y="266" text-anchor="middle" fill="#ff6073" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">RECEIPT</text>
  <text x="1054" y="306" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">failed candidate</text>
  <text x="1054" y="336" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">rollback · compensation</text>
  <text x="1054" y="366" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">cost · descendants</text>
  <text x="1054" y="396" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="18">owner · unresolved effects</text>
  <path d="M633 454 V514" stroke="#ff6073" stroke-width="6" fill="none" stroke-dasharray="10 10"/>
  <text x="640" y="573" text-anchor="middle" fill="#ff6073" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700">EXACT LOCAL ≠ COMPLETE RECOVERY</text>
  <text x="640" y="625" text-anchor="middle" fill="#d9e8ec" font-family="Arial,Helvetica,sans-serif" font-size="21">QUALIFY THE TRANSACTION · OWN THE RESIDUALS</text>
