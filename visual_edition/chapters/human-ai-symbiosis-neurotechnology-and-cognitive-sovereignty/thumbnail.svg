<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Human-AI Symbiosis, Neurotechnology, and Cognitive Sovereignty</title>
  <desc id="desc">A governed state machine diagram for Human-AI Symbiosis, Neurotechnology, and Cognitive Sovereignty shows three named mechanism cards above a labeled failure and evidence boundary.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="70" y="100" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">HUMAN-AI SYMBIOSIS,</text>
  <text x="70" y="158" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">NEUROTECHNOLOGY, AND COGNITIVE</text>
  <text x="70" y="216" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">SOVEREIGNTY</text>
  <rect x="55" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#58B7D3" stroke-width="7"/>
  <text x="240" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="240" y="390">DECLARE COUPLING</tspan>
    <tspan x="240" y="417">MODE INTENDED</tspan>
  </text>
  <text x="240" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="240" y="488">Declare the coupling mode, intended</tspan>
    <tspan x="240" y="511">benefit, affected… enhancement</tspan>
  </text>
  <rect x="455" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#D79A6B" stroke-width="7"/>
  <text x="640" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="640" y="390">MAINTAIN HUMAN-ALONE</tspan>
    <tspan x="640" y="417">AI-ALONE</tspan>
  </text>
  <text x="640" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="640" y="488">Maintain human-alone, AI-alone, and</tspan>
    <tspan x="640" y="511">combined-system baselines.</tspan>
  </text>
  <rect x="855" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#62C370" stroke-width="7"/>
  <text x="1040" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="1040" y="390">COUPLED TRAJECTORIES</tspan>
    <tspan x="1040" y="417">PERFORMANCE</tspan>
  </text>
  <text x="1040" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="1040" y="488">Track coupled trajectories in</tspan>
    <tspan x="1040" y="511">performance, calibration, bias…</tspan>
  </text>
  <path d="M240 565 H1040" stroke="#8F9AA3" stroke-width="5"/>
  <text x="640" y="625" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, sans-serif" font-size="25" font-weight="700">MECHANISM • FAILURE BOUNDARY • EVIDENCE CEILING</text>
</svg>
