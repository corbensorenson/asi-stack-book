<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">The Efficient ASI Hypothesis</title>
  <desc id="desc">One invoice faces four routes. The cheapest visible route grows repair and review costs until its complete bill exceeds a verified route.</desc>
  <defs>
    <linearGradient id="rail" x1="0" x2="1">
      <stop offset="0" stop-color="#58B7D3" stop-opacity="0.18"/>
      <stop offset="0.58" stop-color="#58B7D3"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
    <radialGradient id="residualGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#D66BA0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#D66BA0" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#101820"/>
  <circle cx="985" cy="430" r="280" fill="url(#residualGlow)"/>
  <path d="M0 640 C250 570 445 682 700 625 S1050 560 1280 615" fill="none" stroke="#182630" stroke-width="76" opacity="0.9"/>

  <text x="72" y="94" fill="#58B7D3" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="4">THE ASI STACK · 02</text>
  <text x="70" y="172" fill="#F5F8FA" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="64" font-weight="750">CHEAPEST CAN</text>
  <text x="70" y="237" fill="#F5F8FA" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="64" font-weight="750">COST MORE</text>

  <g transform="translate(85 318)">
    <rect x="0" y="0" width="180" height="230" rx="16" fill="#182630" stroke="#8F9AA3" stroke-width="4"/>
    <text x="90" y="42" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="24" font-weight="750">INVOICE 47</text>
    <g fill="#B8C4CC" font-family="Menlo, monospace" font-size="17">
      <text x="30" y="88">VENDOR  AURORA</text>
      <text x="30" y="120">DATE    08·01</text>
      <text x="30" y="152">SUBTOTAL   84</text>
      <text x="30" y="184" fill="#F45B69" font-weight="700">TAX        ?</text>
      <text x="30" y="216" fill="#58B7D3" font-weight="700">TOTAL     91</text>
    </g>
  </g>

  <g stroke-linecap="round">
    <path d="M310 340 H830" stroke="url(#rail)" stroke-width="7"/>
    <path d="M310 415 H830" stroke="#D79A6B" stroke-width="5" opacity="0.75"/>
    <path d="M310 490 H830" stroke="#F2C14E" stroke-width="5" opacity="0.75"/>
    <path d="M310 565 H830" stroke="#62C370" stroke-width="5" opacity="0.75"/>
  </g>

  <g font-family="Avenir Next, DejaVu Sans, sans-serif" font-weight="750" text-anchor="middle">
    <g transform="translate(535 340)"><rect x="-88" y="-26" width="176" height="52" rx="13" fill="#163341" stroke="#58B7D3" stroke-width="3"/><text y="8" fill="#58B7D3" font-size="21">PARSER · 1</text></g>
    <g transform="translate(535 415)"><rect x="-88" y="-26" width="176" height="52" rx="13" fill="#182630" stroke="#D79A6B" stroke-width="3"/><text y="8" fill="#D79A6B" font-size="21">SPECIALIST · 4</text></g>
    <g transform="translate(535 490)"><rect x="-88" y="-26" width="176" height="52" rx="13" fill="#182630" stroke="#F2C14E" stroke-width="3"/><text y="8" fill="#F2C14E" font-size="21">VERIFIED · 9</text></g>
    <g transform="translate(535 565)"><rect x="-88" y="-26" width="176" height="52" rx="13" fill="#182630" stroke="#62C370" stroke-width="3"/><text y="8" fill="#62C370" font-size="21">HUMAN · H</text></g>
  </g>

  <path d="M830 340 C920 345 920 430 854 454" fill="none" stroke="#F45B69" stroke-width="8" stroke-linecap="round"/>
  <polygon points="845,438 876,450 850,470" fill="#F45B69"/>
  <text x="873" y="330" fill="#F45B69" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="750">TAX FIELD FAILS</text>

  <g transform="translate(870 403)" font-family="Avenir Next, DejaVu Sans, sans-serif" font-weight="750" text-anchor="middle">
    <g transform="translate(0 86)"><rect x="-53" y="-38" width="106" height="76" rx="12" fill="#182630" stroke="#58B7D3" stroke-width="4"/><text y="1" fill="#58B7D3" font-size="30">1</text><text y="25" fill="#B8C4CC" font-size="14">attempt</text></g>
    <text x="75" y="98" fill="#F5F8FA" font-size="38">+</text>
    <g transform="translate(150 86)"><rect x="-53" y="-38" width="106" height="76" rx="12" fill="#182630" stroke="#F45B69" stroke-width="4"/><text y="1" fill="#F45B69" font-size="30">8</text><text y="25" fill="#B8C4CC" font-size="14">repair</text></g>
    <text x="225" y="98" fill="#F5F8FA" font-size="38">+</text>
    <g transform="translate(300 86)"><rect x="-53" y="-38" width="106" height="76" rx="12" fill="#182630" stroke="#D66BA0" stroke-width="4"/><text y="1" fill="#D66BA0" font-size="30">3</text><text y="25" fill="#B8C4CC" font-size="14">review</text></g>
  </g>

  <g transform="translate(902 604)" font-family="Avenir Next, DejaVu Sans, sans-serif" font-weight="800">
    <text x="0" y="0" fill="#F45B69" font-size="54">12</text>
    <text x="92" y="0" fill="#F5F8FA" font-size="48">&gt;</text>
    <text x="165" y="0" fill="#62C370" font-size="54">9</text>
    <text x="355" y="-4" text-anchor="end" fill="#B8C4CC" font-size="21">COMPLETE BILL</text>
  </g>

  <text x="70" y="675" fill="#B8C4CC" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25">Efficiency is accepted useful work</text>
  <text x="477" y="675" fill="#D79A6B" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25" font-weight="700">per total causal cost.</text>
</svg>
