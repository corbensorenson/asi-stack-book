<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Durable Semantic Memory and Knowledge Lattices</title>
  <desc id="desc">A governed state machine diagram for Durable Semantic Memory and Knowledge Lattices shows three named mechanism cards above a labeled failure and evidence boundary.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="70" y="100" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">DURABLE SEMANTIC MEMORY AND</text>
  <text x="70" y="158" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">KNOWLEDGE LATTICES</text>
  <rect x="55" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#58B7D3" stroke-width="7"/>
  <text x="240" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="240" y="390">ASSIGN STABLE</tspan>
    <tspan x="240" y="417">SEMANTIC IDENTITIES</tspan>
  </text>
  <text x="240" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="240" y="488">Assign stable semantic identities</tspan>
    <tspan x="240" y="511">to entities, events… retaining</tspan>
  </text>
  <rect x="455" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#D79A6B" stroke-width="7"/>
  <text x="640" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="640" y="390">ONTOLOGIES RELATION</tspan>
    <tspan x="640" y="417">SCHEMAS MIGRATE</tspan>
  </text>
  <text x="640" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="640" y="488">Version ontologies and relation</tspan>
    <tspan x="640" y="511">schemas; migrate through… preserve</tspan>
  </text>
  <rect x="855" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#62C370" stroke-width="7"/>
  <text x="1040" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="1040" y="390">PROVENANCE SUPPORT</tspan>
    <tspan x="1040" y="417">TEMPORAL SCOPE</tspan>
  </text>
  <text x="1040" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="1040" y="488">Represent provenance, support,</tspan>
    <tspan x="1040" y="511">temporal scope, authority.</tspan>
  </text>
  <path d="M240 565 H1040" stroke="#8F9AA3" stroke-width="5"/>
  <text x="640" y="625" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, sans-serif" font-size="25" font-weight="700">MECHANISM • FAILURE BOUNDARY • EVIDENCE CEILING</text>
</svg>
