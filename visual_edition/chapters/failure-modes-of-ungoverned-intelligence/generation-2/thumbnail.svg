<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Failure Modes of Ungoverned Intelligence</title>
  <desc id="desc">A green success dashboard lifts to expose a connected magenta failure chain and an open residual beneath it.</desc>
  <rect width="1280" height="720" fill="#14262F"/>
  <path d="M0 598 C280 530 470 655 720 588 C920 534 1085 568 1280 514 L1280 720 L0 720 Z" fill="#101820"/>
  <g transform="translate(82 92)">
    <rect x="0" y="0" width="510" height="252" rx="26" fill="#172A33" stroke="#62C370" stroke-width="8"/>
    <text x="255" y="54" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="27" font-weight="700">SERVICE HEALTH</text>
    <path d="M72 169 L145 125 L218 162 L296 103 L372 144 L438 92" fill="none" stroke="#62C370" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="177" y="190" width="156" height="42" rx="12" fill="#182630" stroke="#62C370" stroke-width="4"/>
    <text x="255" y="219" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="23" font-weight="700">SUCCESS</text>
  </g>
  <g transform="translate(130 395)">
    <path d="M0 0 H930" stroke="#F45B69" stroke-width="9" stroke-linecap="round"/>
    <g fill="#182630" stroke="#F45B69" stroke-width="5">
      <circle cx="45" cy="0" r="32"/><circle cx="185" cy="0" r="32"/><circle cx="325" cy="0" r="32"/>
      <circle cx="465" cy="0" r="32"/><circle cx="605" cy="0" r="32"/><circle cx="745" cy="0" r="32"/><circle cx="885" cy="0" r="32"/>
    </g>
    <g fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      <text x="45" y="6">GOAL</text><text x="185" y="6">CONTEXT</text><text x="325" y="6">AUTH</text>
      <text x="465" y="6">EVAL</text><text x="605" y="6">TOOL</text><text x="745" y="6">METRIC</text><text x="885" y="6">LEARN</text>
    </g>
  </g>
  <g transform="translate(1080 332)">
    <rect x="0" y="0" width="182" height="132" rx="22" fill="#182630" stroke="#D66BA0" stroke-width="7" stroke-dasharray="18 10"/>
    <text x="91" y="56" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700">RESIDUAL</text>
    <text x="91" y="91" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="28" font-weight="700">OPEN</text>
  </g>
  <text x="82" y="580" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="72" font-weight="800">GREEN ≠ HEALTHY</text>
  <text x="86" y="640" fill="#F2C14E" font-family="Avenir Next, sans-serif" font-size="29" font-weight="700">A LOCAL SUCCESS CAN HIDE A JOINED FAILURE</text>
</svg>
