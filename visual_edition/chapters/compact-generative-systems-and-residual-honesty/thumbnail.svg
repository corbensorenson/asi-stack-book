<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Compact Generative Systems: Generate, Verify, Repair, and Residual Honesty</title>
  <desc id="desc">A governed stack diagram for Compact Generative Systems: Generate, Verify, Repair, and Residual Honesty shows three named mechanism cards above a labeled failure and evidence boundary.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="70" y="100" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">COMPACT GENERATIVE SYSTEMS:</text>
  <text x="70" y="158" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">GENERATE, VERIFY, REPAIR, AND</text>
  <text x="70" y="216" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="48" font-weight="700">RESIDUAL HONESTY</text>
  <rect x="55" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#58B7D3" stroke-width="7"/>
  <text x="240" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="240" y="390">FREEZE EXACT SOURCE</tspan>
    <tspan x="240" y="417">ARTIFACT</tspan>
  </text>
  <text x="240" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="240" y="488">Freeze the exact source artifact or</tspan>
    <tspan x="240" y="511">state… horizon before searching.</tspan>
  </text>
  <rect x="455" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#D79A6B" stroke-width="7"/>
  <text x="640" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="640" y="390">LITERAL DATA</tspan>
    <tspan x="640" y="417">STANDARD CODEC</tspan>
  </text>
  <text x="640" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="640" y="488">Inventory literal data, standard</tspan>
    <tspan x="640" y="511">codec state, generator… artifacts,</tspan>
  </text>
  <rect x="855" y="345" width="370" height="190" rx="22" fill="#182630" stroke="#62C370" stroke-width="7"/>
  <text x="1040" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="21" font-weight="700">
    <tspan x="1040" y="390">EVERY CANDIDATE</tspan>
    <tspan x="1040" y="417">EXACT SOURCE</tspan>
  </text>
  <text x="1040" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="17">
    <tspan x="1040" y="488">Bind every candidate to exact</tspan>
    <tspan x="1040" y="511">source lineage… permitted uses,</tspan>
  </text>
  <path d="M240 565 H1040" stroke="#8F9AA3" stroke-width="5"/>
  <text x="640" y="625" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, sans-serif" font-size="25" font-weight="700">MECHANISM • FAILURE BOUNDARY • EVIDENCE CEILING</text>
</svg>
