<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Disagreement needs a lease</title>
  <desc id="desc">One emergency generator sits between Harbor Clinic and Hillside Homes. A bounded decision lease and rights receipt keep disagreement visible, challengeable, and reviewable.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/>
      <stop offset="1" stop-color="#102832"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79a4f"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 600 C240 548 388 650 604 586 S1000 532 1280 584" fill="none" stroke="#173845" stroke-width="2"/>
  <path d="M0 638 C240 578 420 682 650 620 S1030 566 1280 616" fill="none" stroke="#122c3a" stroke-width="2"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="70" y="66" fill="#67d5f2" font-size="23" font-weight="700" letter-spacing="4">THE ASI STACK · CHAPTER 14</text>
    <text x="70" y="132" fill="#f6f1e8" font-size="57" font-weight="800" letter-spacing="-1">DISAGREEMENT NEEDS</text>
    <text x="70" y="194" fill="#f6f1e8" font-size="57" font-weight="800" letter-spacing="-1">A LEASE</text>
    <rect x="72" y="218" width="428" height="4" rx="2" fill="url(#gold)"/>
    <text x="72" y="258" fill="#d79a4f" font-size="20" font-weight="700" letter-spacing="2">MORAL UNCERTAINTY · CONTESTABLE GOVERNANCE</text>

    <g transform="translate(72 335)">
      <text x="0" y="-18" fill="#8fb1c1" font-size="16" font-weight="700" letter-spacing="2">ONE SCARCE RESOURCE</text>
      <rect x="0" y="20" width="190" height="112" rx="20" fill="#142632" stroke="#f2bd63" stroke-width="5"/>
      <text x="95" y="62" text-anchor="middle" fill="#ffd36a" font-size="18" font-weight="800">GENERATOR</text>
      <rect x="59" y="78" width="72" height="22" rx="11" fill="#102b38" stroke="#67d5f2" stroke-width="2"/>
      <text x="95" y="94" text-anchor="middle" fill="#67d5f2" font-size="12" font-weight="800">1 SLOT</text>
      <path d="M194 58 C246 58 258 6 316 6" fill="none" stroke="#66d58a" stroke-width="6"/>
      <path d="M194 82 C246 82 258 136 316 136" fill="none" stroke="#9c82e8" stroke-width="6"/>
      <path d="M306 0 l22 7 -18 14" fill="#66d58a"/>
      <path d="M306 130 l22 6 -18 14" fill="#9c82e8"/>
      <rect x="330" y="-27" width="216" height="64" rx="17" fill="#102b28" stroke="#66d58a" stroke-width="4"/>
      <text x="438" y="12" text-anchor="middle" fill="#66d58a" font-size="16" font-weight="800">HARBOR CLINIC</text>
      <rect x="330" y="104" width="216" height="64" rx="17" fill="#241c32" stroke="#9c82e8" stroke-width="4"/>
      <text x="438" y="143" text-anchor="middle" fill="#c7b7ff" font-size="16" font-weight="800">HILLSIDE HOMES</text>
    </g>

    <g transform="translate(724 326)" filter="url(#glow)">
      <rect width="270" height="194" rx="24" fill="#142632" stroke="url(#gold)" stroke-width="5"/>
      <text x="135" y="39" text-anchor="middle" fill="#ffd36a" font-size="18" font-weight="800">DECISION LEASE</text>
      <text x="135" y="73" text-anchor="middle" fill="#f6f1e8" font-size="20" font-weight="800">NARROW ACTION</text>
      <line x1="38" y1="94" x2="232" y2="94" stroke="#426476" stroke-width="3"/>
      <text x="135" y="124" text-anchor="middle" fill="#67d5f2" font-size="15" font-weight="700">SCOPE · EXPIRY · REVIEW</text>
      <text x="135" y="151" text-anchor="middle" fill="#67d5f2" font-size="15" font-weight="700">ROLLBACK · REDRESS</text>
      <rect x="59" y="164" width="152" height="22" rx="11" fill="#102b38" stroke="#67d5f2" stroke-width="2"/>
      <text x="135" y="180" text-anchor="middle" fill="#67d5f2" font-size="12" font-weight="800">RIGHTS RECEIPT</text>
    </g>

    <rect x="72" y="650" width="468" height="40" rx="20" fill="#142632" stroke="#67d5f2" stroke-width="2"/>
    <text x="306" y="676" text-anchor="middle" fill="#67d5f2" font-size="17" font-weight="800">DISSENT · APPEAL · NEXT REVIEW</text>
    <rect x="564" y="650" width="414" height="40" rx="20" fill="#271c2a" stroke="#ff6073" stroke-width="2"/>
    <text x="771" y="676" text-anchor="middle" fill="#ff6073" font-size="17" font-weight="800">NO MORAL TRUTH CERTIFICATE</text>
  </g>
</svg>
