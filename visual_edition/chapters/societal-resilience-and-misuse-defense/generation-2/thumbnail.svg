<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">When prevention fails, who repairs the harm?</title>
  <desc id="desc">A fictional Harborline service connects to a four-stage resilience loop, a federated incident envelope, and a residual owner.</desc>
  <rect width="1280" height="720" fill="#0D1D26"/>
  <rect x="42" y="42" width="1196" height="636" rx="28" fill="#0F2029" stroke="#6D8793" stroke-width="3"/>
  <text x="82" y="112" fill="#F2BD63" font-family="Arial, sans-serif" font-size="39" font-weight="700" letter-spacing="1.4">WHEN PREVENTION FAILS, WHO REPAIRS THE HARM?</text>
  <text x="84" y="153" fill="#C6D5DC" font-family="Arial, sans-serif" font-size="22">Societal resilience and misuse defense</text>
  <rect x="88" y="252" width="260" height="146" rx="18" fill="#142934" stroke="#F2BD63" stroke-width="5"/>
  <text x="218" y="293" text-anchor="middle" fill="#F2BD63" font-family="Arial, sans-serif" font-size="21" font-weight="700">HARBORLINE</text>
  <text x="218" y="341" text-anchor="middle" fill="#E9F2F5" font-family="Arial, sans-serif" font-size="25" font-weight="700">REAL SERVICE</text>
  <text x="218" y="371" text-anchor="middle" fill="#67D5F2" font-family="Arial, sans-serif" font-size="16">SYNTHETIC EXERCISE</text>
  <circle cx="645" cy="330" r="135" fill="none" stroke="#6D8793" stroke-width="4"/>
  <path d="M645 195 A135 135 0 0 1 780 330" fill="none" stroke="#F2BD63" stroke-width="16"/>
  <path d="M780 330 A135 135 0 0 1 645 465" fill="none" stroke="#67D5F2" stroke-width="16"/>
  <path d="M645 465 A135 135 0 0 1 510 330" fill="none" stroke="#66D58A" stroke-width="16"/>
  <path d="M510 330 A135 135 0 0 1 645 195" fill="none" stroke="#9C82E8" stroke-width="16"/>
  <text x="645" y="295" text-anchor="middle" fill="#E9F2F5" font-family="Arial, sans-serif" font-size="23" font-weight="700">RESILIENCE</text>
  <text x="645" y="330" text-anchor="middle" fill="#F2BD63" font-family="Arial, sans-serif" font-size="21" font-weight="700">RESIST</text>
  <text x="645" y="359" text-anchor="middle" fill="#67D5F2" font-family="Arial, sans-serif" font-size="21" font-weight="700">ABSORB · RECOVER · ADAPT</text>
  <rect x="920" y="242" width="254" height="82" rx="16" fill="#142934" stroke="#67D5F2" stroke-width="5"/>
  <text x="1047" y="278" text-anchor="middle" fill="#67D5F2" font-family="Arial, sans-serif" font-size="21" font-weight="700">INCIDENT ENVELOPE</text>
  <text x="1047" y="305" text-anchor="middle" fill="#E9F2F5" font-family="Arial, sans-serif" font-size="16">MINIMAL · EXPIRING</text>
  <rect x="916" y="372" width="264" height="82" rx="16" fill="#142934" stroke="#FF6073" stroke-width="5"/>
  <text x="1048" y="408" text-anchor="middle" fill="#FF6073" font-family="Arial, sans-serif" font-size="21" font-weight="700">RESIDUAL OWNER</text>
  <text x="1048" y="435" text-anchor="middle" fill="#E9F2F5" font-family="Arial, sans-serif" font-size="16">CUSTODY · TRIGGER · EXPIRY</text>
  <path d="M348 325 L496 325" stroke="#F2BD63" stroke-width="5"/>
  <polygon points="496,325 474,312 474,338" fill="#F2BD63"/>
  <path d="M780 292 L916 282" stroke="#67D5F2" stroke-width="5"/>
  <polygon points="916,282 894,268 896,294" fill="#67D5F2"/>
  <path d="M780 416 L916 418" stroke="#FF6073" stroke-width="5"/>
  <polygon points="916,418 894,405 894,431" fill="#FF6073"/>
  <text x="640" y="610" text-anchor="middle" fill="#66D58A" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">RESPONSE IS NOT PROOF OF A SAFE SOCIETY</text>
</svg>
