<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Living Book Methodology</title>
  <desc id="desc">A canonical book source anchors a governed graph of sources, claims, proofs, tests, derivatives, releases, corrections, and one active roadmap.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="70" y="105" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="58" font-weight="700">LIVING BOOK METHODOLOGY</text>
  <text x="70" y="160" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="30">Evidence-preserving publication transactions</text>
  <rect x="470" y="260" width="340" height="180" rx="24" fill="#182630" stroke="#58B7D3" stroke-width="8"/>
  <text x="640" y="330" text-anchor="middle" fill="#58B7D3" font-family="Avenir Next, sans-serif" font-size="32" font-weight="700">CANONICAL</text>
  <text x="640" y="375" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="38" font-weight="700">BOOK SOURCE</text>
  <g fill="#182630" stroke-width="6" font-family="Avenir Next, sans-serif" font-size="22" font-weight="700" text-anchor="middle">
    <rect x="80" y="245" width="210" height="90" rx="16" stroke="#62C370"/><text x="185" y="300" fill="#62C370">SOURCES</text>
    <rect x="80" y="405" width="210" height="90" rx="16" stroke="#D66BA0"/><text x="185" y="460" fill="#D66BA0">CLAIMS</text>
    <rect x="990" y="245" width="210" height="90" rx="16" stroke="#F2C14E"/><text x="1095" y="300" fill="#F2C14E">PROOFS + TESTS</text>
    <rect x="990" y="405" width="210" height="90" rx="16" stroke="#D79A6B"/><text x="1095" y="460" fill="#D79A6B">DERIVATIVES</text>
    <rect x="370" y="555" width="240" height="90" rx="16" stroke="#8F9AA3"/><text x="490" y="610" fill="#B8C4CC">RELEASES</text>
    <rect x="670" y="555" width="240" height="90" rx="16" stroke="#F45B69"/><text x="790" y="610" fill="#F45B69">CORRECTIONS</text>
  </g>
  <path d="M290 290 H470 M290 450 H470 M810 290 H990 M810 450 H990 M560 440 L500 555 M720 440 L780 555" stroke="#8F9AA3" stroke-width="6"/>
  <text x="640" y="690" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="26" font-weight="700">ONE CANONICAL GRAPH • ONE ACTIVE ROADMAP</text>
</svg>
