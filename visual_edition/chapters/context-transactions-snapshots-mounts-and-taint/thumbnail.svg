<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Context Transactions, Snapshots, Mounts, and Taint</title>
  <desc id="desc">A versioned snapshot branches into memory derivatives, with gold mount gates, magenta taint propagation, and an owned backup residual.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <text x="80" y="105" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="54" font-weight="700">CONTEXT TRANSACTIONS</text>
  <text x="80" y="160" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="30">Snapshots • mounts • branches • taint • closure</text>
  <rect x="80" y="230" width="260" height="150" rx="22" fill="#182630" stroke="#58B7D3" stroke-width="7"/>
  <text x="210" y="300" text-anchor="middle" fill="#58B7D3" font-family="Menlo, monospace" font-size="36" font-weight="700">SNAPSHOT 41</text>
  <text x="210" y="345" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="25">exact versions</text>
  <path d="M340 305 H470 M470 305 V225 M470 305 V385 M470 225 H575 M470 385 H575" fill="none" stroke="#58B7D3" stroke-width="8"/>
  <rect x="575" y="165" width="210" height="120" rx="18" fill="#182630" stroke="#F2C14E" stroke-width="6"/>
  <text x="680" y="235" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, sans-serif" font-size="28" font-weight="700">BRANCH B</text>
  <rect x="575" y="325" width="210" height="120" rx="18" fill="#182630" stroke="#8F9AA3" stroke-width="6"/>
  <text x="680" y="395" text-anchor="middle" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="28" font-weight="700">BRANCH C</text>
  <path d="M785 225 H930 M785 385 H930" stroke="#D66BA0" stroke-width="8" stroke-dasharray="18 12"/>
  <circle cx="1035" cy="225" r="92" fill="#182630" stroke="#D66BA0" stroke-width="7"/>
  <text x="1035" y="215" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="26" font-weight="700">TAINTED</text>
  <text x="1035" y="252" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="24">DERIVATIVES</text>
  <circle cx="1035" cy="455" r="92" fill="none" stroke="#D66BA0" stroke-width="7" stroke-dasharray="16 12"/>
  <text x="1035" y="445" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="25" font-weight="700">BACKUP</text>
  <text x="1035" y="480" text-anchor="middle" fill="#D66BA0" font-family="Avenir Next, sans-serif" font-size="22">RESIDUAL</text>
  <text x="640" y="620" text-anchor="middle" fill="#62C370" font-family="Avenir Next, sans-serif" font-size="32" font-weight="700">VALID TRANSITION ≠ ADEQUATE EVIDENCE</text>
</svg>
