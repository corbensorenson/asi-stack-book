<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ASI Is a Stack, Not a Model</title>
  <desc id="desc">A small model circle sits inside seven governed architecture layers connected by typed arrows, with authority, evidence, residual, and rollback boundaries visible.</desc>
  <rect width="1280" height="720" fill="#101820"/>
  <rect x="60" y="54" width="1160" height="612" rx="24" fill="#182630" stroke="#58B7D3" stroke-width="4"/>
  <text x="98" y="150" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="64" font-weight="700">ASI IS A STACK</text>
  <text x="100" y="210" fill="#B8C4CC" font-family="Avenir Next, sans-serif" font-size="36">not one undifferentiated model</text>
  <circle cx="310" cy="425" r="105" fill="#101820" stroke="#D79A6B" stroke-width="5"/>
  <text x="310" y="438" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, sans-serif" font-size="34" font-weight="700">MODEL</text>
  <g font-family="Avenir Next, sans-serif" font-size="25" font-weight="700" text-anchor="middle">
    <rect x="510" y="290" width="190" height="74" rx="12" fill="#101820" stroke="#58B7D3" stroke-width="3"/>
    <text x="605" y="337" fill="#58B7D3">PLANNING</text>
    <rect x="735" y="290" width="190" height="74" rx="12" fill="#101820" stroke="#B8C4CC" stroke-width="3"/>
    <text x="830" y="337" fill="#B8C4CC">CONTEXT</text>
    <rect x="960" y="290" width="190" height="74" rx="12" fill="#101820" stroke="#62C370" stroke-width="3"/>
    <text x="1055" y="337" fill="#62C370">VERIFY</text>
    <rect x="510" y="410" width="190" height="74" rx="12" fill="#101820" stroke="#F2C14E" stroke-width="3"/>
    <text x="605" y="457" fill="#F2C14E">AUTHORITY</text>
    <rect x="735" y="410" width="190" height="74" rx="12" fill="#101820" stroke="#D79A6B" stroke-width="3"/>
    <text x="830" y="457" fill="#D79A6B">EXECUTION</text>
    <rect x="960" y="410" width="190" height="74" rx="12" fill="#101820" stroke="#62C370" stroke-width="3"/>
    <text x="1055" y="457" fill="#62C370">EVIDENCE</text>
  </g>
  <g stroke="#8F9AA3" stroke-width="4" fill="none">
    <path d="M415 425 H490"/>
    <path d="M700 327 H725"/>
    <path d="M925 327 H950"/>
    <path d="M700 447 H725"/>
    <path d="M925 447 H950"/>
  </g>
  <path d="M1145 515 C1050 610, 790 620, 650 520" fill="none" stroke="#F45B69" stroke-width="5"/>
  <polygon points="645,520 670,508 663,536" fill="#F45B69"/>
  <text x="905" y="590" fill="#F45B69" font-family="Avenir Next, sans-serif" font-size="25" font-weight="700">ROLLBACK REMAINS EXPLICIT</text>
</svg>
