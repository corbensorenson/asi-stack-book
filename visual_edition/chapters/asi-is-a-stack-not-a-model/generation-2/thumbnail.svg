<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">ASI Is a Stack, Not a Model</title>
  <desc id="desc">A correct delete command from a model stops at a gold authority gate while an observer and rollback path remain outside the model.</desc>
  <defs>
    <radialGradient id="modelGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0" stop-color="#D79A6B" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#D79A6B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyanRail" x1="0" x2="1">
      <stop offset="0" stop-color="#58B7D3" stop-opacity="0.15"/>
      <stop offset="0.55" stop-color="#58B7D3"/>
      <stop offset="1" stop-color="#F2C14E"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#101820"/>
  <circle cx="885" cy="380" r="270" fill="url(#modelGlow)"/>
  <path d="M0 615 C270 560 410 675 690 618 S1070 545 1280 600" fill="none" stroke="#182630" stroke-width="70" opacity="0.8"/>

  <text x="72" y="108" fill="#58B7D3" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25" font-weight="700" letter-spacing="4">THE ASI STACK · 01</text>
  <text x="70" y="185" fill="#F5F8FA" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="62" font-weight="750">A CORRECT COMMAND</text>
  <text x="70" y="248" fill="#F5F8FA" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="62" font-weight="750">IS NOT AUTHORITY</text>

  <g transform="translate(88 337)">
    <text x="0" y="-25" fill="#8F9AA3" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="700">12 DUPLICATES</text>
    <g fill="#182630" stroke="#6E7D86" stroke-width="2">
      <rect x="0" y="0" width="65" height="46" rx="7"/><rect x="78" y="0" width="65" height="46" rx="7"/>
      <rect x="0" y="59" width="65" height="46" rx="7"/><rect x="78" y="59" width="65" height="46" rx="7"/>
      <rect x="0" y="118" width="65" height="46" rx="7"/><rect x="78" y="118" width="65" height="46" rx="7"/>
    </g>
    <g stroke="#58B7D3" stroke-width="3" opacity="0.85">
      <path d="M18 15h28M18 25h34M18 34h22"/><path d="M96 15h28M96 25h34M96 34h22"/>
      <path d="M18 74h28M18 84h34M18 93h22"/><path d="M96 74h28M96 84h34M96 93h22"/>
      <path d="M18 133h28M18 143h34M18 152h22"/><path d="M96 133h28M96 143h34M96 152h22"/>
    </g>
  </g>

  <g transform="translate(330 408)">
    <rect x="0" y="0" width="220" height="92" rx="20" fill="#18313C" stroke="#58B7D3" stroke-width="4" filter="url(#softGlow)"/>
    <circle cx="40" cy="46" r="15" fill="#58B7D3"/>
    <text x="70" y="40" fill="#F5F8FA" font-family="Menlo, monospace" font-size="23" font-weight="700">DELETE 12</text>
    <text x="70" y="67" fill="#8F9AA3" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="17">model proposal</text>
  </g>

  <path d="M550 454 H733" stroke="url(#cyanRail)" stroke-width="8" stroke-linecap="round"/>
  <polygon points="730,438 760,454 730,470" fill="#F2C14E"/>

  <g transform="translate(775 311)">
    <path d="M0 0 V285" stroke="#F2C14E" stroke-width="13" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M34 0 V285" stroke="#F2C14E" stroke-width="5" stroke-linecap="round" opacity="0.65"/>
    <circle cx="17" cy="143" r="33" fill="#101820" stroke="#F2C14E" stroke-width="5"/>
    <path d="M9 143l9 10 18-23" fill="none" stroke="#F2C14E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="17" y="-23" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="22" font-weight="750">AUTHORITY</text>
  </g>

  <g transform="translate(965 394)">
    <circle cx="0" cy="0" r="92" fill="#182630" stroke="#D79A6B" stroke-width="4"/>
    <circle cx="0" cy="0" r="42" fill="#101820" stroke="#D79A6B" stroke-width="4"/>
    <text x="0" y="9" text-anchor="middle" fill="#D79A6B" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25" font-weight="750">DRIVE</text>
  </g>

  <g transform="translate(1090 330)">
    <circle cx="0" cy="0" r="35" fill="#101820" stroke="#62C370" stroke-width="6"/>
    <circle cx="0" cy="0" r="10" fill="#62C370"/>
    <text x="0" y="62" text-anchor="middle" fill="#62C370" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="19" font-weight="750">OBSERVE</text>
  </g>
  <path d="M1125 402 C1190 470 1170 565 1035 576 C910 586 820 550 814 505" fill="none" stroke="#F45B69" stroke-width="7" stroke-linecap="round"/>
  <polygon points="799,512 819,480 835,515" fill="#F45B69"/>
  <text x="1055" y="625" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="21" font-weight="750">ROLLBACK STAYS INDEPENDENT</text>

  <text x="70" y="665" fill="#B8C4CC" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25">Capability proposes.</text>
  <text x="335" y="665" fill="#F2C14E" font-family="Avenir Next, DejaVu Sans, sans-serif" font-size="25" font-weight="700">The stack decides and verifies.</text>
</svg>
