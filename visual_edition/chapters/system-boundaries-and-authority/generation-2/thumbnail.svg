<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">CAN does not equal MAY</title>
  <desc id="desc">A complete refund instruction reaches an amber authority membrane but stops because the DISCLOSE permission stamp is missing.</desc>
  <rect width="1280" height="720" fill="#14262f"/>
  <circle cx="1140" cy="90" r="170" fill="#153847" opacity="0.5"/>
  <circle cx="90" cy="650" r="210" fill="#2c2322" opacity="0.48"/>
  <text x="72" y="92" fill="#7ed8f6" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="4">THE ASI STACK · 03</text>
  <text x="72" y="190" fill="#eef5f7" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="800">CAN</text>
  <text x="294" y="190" fill="#e56b83" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="800">≠</text>
  <text x="400" y="190" fill="#f1bd58" font-family="Inter,Arial,sans-serif" font-size="92" font-weight="800">MAY</text>
  <text x="75" y="238" fill="#9db0b8" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="600">A flawless action can still be unauthorized.</text>
  <rect x="82" y="330" width="350" height="220" rx="24" fill="#142b37" stroke="#59c7ea" stroke-width="6"/>
  <text x="257" y="390" text-anchor="middle" fill="#59c7ea" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="800">REFUND 47</text>
  <text x="128" y="445" fill="#65c987" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">ACCOUNT ✓</text>
  <text x="128" y="487" fill="#65c987" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">$240 ✓</text>
  <text x="128" y="529" fill="#65c987" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700">COMMAND ✓</text>
  <path d="M432 440 C540 440 590 440 675 440" fill="none" stroke="#59c7ea" stroke-width="12" stroke-linecap="round"/>
  <path d="M676 440 L644 418 M676 440 L644 462" fill="none" stroke="#59c7ea" stroke-width="12" stroke-linecap="round"/>
  <line x1="720" y1="288" x2="720" y2="600" stroke="#f1bd58" stroke-width="12"/>
  <line x1="702" y1="340" x2="738" y2="340" stroke="#f1bd58" stroke-width="6"/>
  <line x1="702" y1="440" x2="738" y2="440" stroke="#f1bd58" stroke-width="6"/>
  <line x1="702" y1="540" x2="738" y2="540" stroke="#f1bd58" stroke-width="6"/>
  <text x="754" y="465" transform="rotate(-90 754 465)" fill="#f1bd58" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" letter-spacing="3">AUTHORITY</text>
  <rect x="802" y="355" width="378" height="110" rx="18" fill="#241c22" stroke="#e56b83" stroke-width="6"/>
  <text x="991" y="402" text-anchor="middle" fill="#9db0b8" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">PERMISSION CLASS</text>
  <text x="991" y="444" text-anchor="middle" fill="#e56b83" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="900">DISCLOSE · MISSING</text>
  <circle cx="720" cy="440" r="18" fill="#e56b83"/>
  <text x="82" y="650" fill="#eef5f7" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700">System Boundaries and Authority</text>
</svg>
