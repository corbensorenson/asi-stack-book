<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Human Factors and Meaningful Control in Oversight</title>
  <desc id="desc">A human reviewer stands inside a broken eight-part control envelope. A twelve-second commit clock beats a fourteen-second stop path, and the transfer is routed into safe hold without scoring the person.</desc>
  <rect width="1280" height="720" fill="#111F28"/>
  <text x="72" y="86" fill="#58B7D3" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="3">THE ASI STACK</text>
  <text x="72" y="158" fill="#F5F8FA" font-family="Avenir Next, Arial, sans-serif" font-size="61" font-weight="700">A click is not control.</text>
  <text x="72" y="204" fill="#B8C4CC" font-family="Avenir Next, Arial, sans-serif" font-size="25">Human Factors and Meaningful Control in Oversight</text>

  <rect x="72" y="286" width="390" height="102" rx="18" fill="#172A34" stroke="#58B7D3" stroke-width="5"/>
  <text x="267" y="326" text-anchor="middle" fill="#62C370" font-family="Avenir Next, Arial, sans-serif" font-size="19" font-weight="700">RECOMMENDATION · GREEN</text>
  <text x="267" y="360" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="22" font-weight="700">PRESSURE · CONTRADICTION</text>

  <g transform="translate(650 427)">
    <circle r="78" fill="#182630" stroke="#F2C14E" stroke-width="6"/>
    <circle cy="-20" r="19" fill="none" stroke="#F2C14E" stroke-width="6"/>
    <path d="M-41 47 Q0 8 41 47" fill="none" stroke="#F2C14E" stroke-width="6"/>
    <text y="58" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="12" font-weight="700">REVIEWER</text>
    <path d="M-10 -132 A132 132 0 0 1 84 -102" fill="none" stroke="#62C370" stroke-width="14"/>
    <path d="M101 -85 A132 132 0 0 1 132 -5" fill="none" stroke="#62C370" stroke-width="14"/>
    <path d="M130 18 A132 132 0 0 1 83 103" fill="none" stroke="#F45B69" stroke-width="14"/>
    <path d="M64 115 A132 132 0 0 1 -21 130" fill="none" stroke="#F45B69" stroke-width="14"/>
    <path d="M-44 124 A132 132 0 0 1 -110 72" fill="none" stroke="#F45B69" stroke-width="14"/>
    <path d="M-122 49 A132 132 0 0 1 -126 -38" fill="none" stroke="#62C370" stroke-width="14"/>
    <path d="M-117 -60 A132 132 0 0 1 -51 -122" fill="none" stroke="#62C370" stroke-width="14"/>
    <path d="M-29 -129 A132 132 0 0 1 -10 -132" fill="none" stroke="#62C370" stroke-width="14"/>
    <text x="118" y="111" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">TIME</text>
    <text x="-4" y="164" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">LOAD</text>
    <text x="-158" y="89" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="15" font-weight="700">STOP</text>
  </g>

  <g transform="translate(941 303)">
    <circle r="68" fill="#182630" stroke="#F45B69" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#F45B69" stroke-width="7"/>
    <text y="28" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">12s</text>
    <text y="103" text-anchor="middle" fill="#F45B69" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="700">COMMIT</text>
  </g>
  <g transform="translate(1090 475)">
    <circle r="68" fill="#182630" stroke="#F2C14E" stroke-width="6"/>
    <line x1="0" y1="0" x2="0" y2="-45" stroke="#F2C14E" stroke-width="7"/>
    <text y="28" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="24" font-weight="700">14s</text>
    <text y="103" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="17" font-weight="700">STOP PATH</text>
  </g>

  <path d="M778 474 C851 510 852 596 950 596" fill="none" stroke="#62C370" stroke-width="8"/>
  <polygon points="950,596 929,584 929,608" fill="#62C370"/>
  <rect x="953" y="555" width="255" height="82" rx="30" fill="#17352F" stroke="#62C370" stroke-width="6"/>
  <text x="1080" y="607" text-anchor="middle" fill="#62C370" font-family="Avenir Next, Arial, sans-serif" font-size="27" font-weight="700">SAFE HOLD</text>

  <rect x="72" y="570" width="600" height="67" rx="14" fill="#182630" stroke="#F2C14E" stroke-width="4"/>
  <text x="372" y="612" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="700">CONTROL CONDITIONS · NOT A PERSON SCORE</text>
</svg>
