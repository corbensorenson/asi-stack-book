<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Military AI, Autonomous Weapons, and Strategic Stability</title>
  <desc id="desc">Two warning displays converge on one provenance root while a twelve-minute clock contracts to two minutes before a command boundary.</desc>
  <rect width="1280" height="720" fill="#14262F"/>
  <path d="M0 610 C220 555 412 650 650 596 C890 542 1060 582 1280 518 L1280 720 L0 720 Z" fill="#101820"/>
  <g transform="translate(64 72)">
    <rect x="0" y="20" width="242" height="88" rx="18" fill="#172A33" stroke="#35B6D0" stroke-width="6"/>
    <rect x="0" y="152" width="242" height="88" rx="18" fill="#172A33" stroke="#35B6D0" stroke-width="6"/>
    <text x="121" y="76" text-anchor="middle" fill="#35B6D0" font-family="Avenir Next, sans-serif" font-size="29" font-weight="800">DISPLAY A</text>
    <text x="121" y="208" text-anchor="middle" fill="#35B6D0" font-family="Avenir Next, sans-serif" font-size="29" font-weight="800">DISPLAY B</text>
    <path d="M248 64 C338 64 342 176 430 176" fill="none" stroke="#E65C79" stroke-width="9" stroke-linecap="round"/>
    <path d="M248 196 C338 196 342 176 430 176" fill="none" stroke="#E65C79" stroke-width="9" stroke-linecap="round"/>
    <circle cx="474" cy="176" r="47" fill="#172A33" stroke="#E65C79" stroke-width="7"/>
    <text x="474" y="168" text-anchor="middle" fill="#E65C79" font-family="Avenir Next, sans-serif" font-size="18" font-weight="800">ONE</text>
    <text x="474" y="192" text-anchor="middle" fill="#E65C79" font-family="Avenir Next, sans-serif" font-size="18" font-weight="800">SOURCE</text>
    <text x="238" y="302" text-anchor="middle" fill="#F5F8FA" font-family="Avenir Next, sans-serif" font-size="27" font-weight="700">TWO DISPLAYS · ONE LINEAGE</text>
  </g>
  <g transform="translate(675 90)">
    <circle cx="170" cy="166" r="142" fill="#172A33" stroke="#F2C14E" stroke-width="11"/>
    <line x1="170" y1="166" x2="170" y2="72" stroke="#F2C14E" stroke-width="10" stroke-linecap="round"/>
    <text x="170" y="192" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, sans-serif" font-size="38" font-weight="800">12 MIN</text>
    <path d="M344 166 H405" stroke="#E65C79" stroke-width="9" stroke-linecap="round"/>
    <polygon points="421,166 390,148 390,184" fill="#E65C79"/>
    <circle cx="506" cy="166" r="82" fill="#172A33" stroke="#E65C79" stroke-width="11"/>
    <line x1="506" y1="166" x2="506" y2="112" stroke="#E65C79" stroke-width="10" stroke-linecap="round"/>
    <text x="506" y="190" text-anchor="middle" fill="#E65C79" font-family="Avenir Next, sans-serif" font-size="34" font-weight="800">2 MIN</text>
    <line x1="560" y1="24" x2="560" y2="318" stroke="#F2C14E" stroke-width="10"/>
    <rect x="330" y="326" width="250" height="58" rx="14" fill="#172A33" stroke="#F2C14E" stroke-width="5"/>
    <text x="455" y="364" text-anchor="middle" fill="#F2C14E" font-family="Avenir Next, sans-serif" font-size="21" font-weight="800">COMMAND BOUNDARY</text>
