  <text x="68" y="615" fill="#F2C14E" font-family="Avenir Next, sans-serif" font-size="29" font-weight="800">PROVENANCE · DECISION TIME · ACCOUNTABLE COMMAND</text>
  <rect x="68" y="651" width="358" height="42" rx="11" fill="#172A33" stroke="#E65C79" stroke-width="3"/>
  <text x="247" y="679" text-anchor="middle" fill="#E65C79" font-family="Avenir Next, sans-serif" font-size="18" font-weight="800">SYNTHETIC · NO WEAPON AUTHORITY</text>
