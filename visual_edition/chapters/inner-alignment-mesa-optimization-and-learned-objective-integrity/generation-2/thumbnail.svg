<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Correct behavior can hide the learned rule</title>
  <desc id="desc">Two policy traces agree on training data, then a sealed stripe swap sends one route to the wrong dock while a finite evidence boundary remains visible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/>
      <stop offset="1" stop-color="#102832"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d79a4f"/>
      <stop offset="1" stop-color="#ffd36a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <path d="M0 596 C220 542 360 636 570 578 S930 520 1280 566" fill="none" stroke="#173845" stroke-width="2"/>
  <path d="M0 626 C230 568 398 664 610 606 S950 552 1280 600" fill="none" stroke="#122c3a" stroke-width="2"/>

  <g font-family="Inter, Helvetica, Arial, sans-serif">
    <text x="72" y="72" fill="#65d5f2" font-size="24" font-weight="700" letter-spacing="4">THE ASI STACK · CHAPTER 13</text>
    <text x="72" y="142" fill="#f6f1e8" font-size="55" font-weight="800" letter-spacing="-1">CORRECT BEHAVIOR CAN HIDE</text>
    <text x="72" y="204" fill="#f6f1e8" font-size="55" font-weight="800" letter-spacing="-1">THE LEARNED RULE</text>
    <rect x="74" y="229" width="708" height="4" rx="2" fill="url(#gold)"/>
    <text x="74" y="271" fill="#d79a4f" font-size="22" font-weight="700" letter-spacing="2">MESA-OPTIMIZATION · OBJECTIVE INTEGRITY</text>

    <g transform="translate(72 332)">
      <text x="0" y="-18" fill="#8fb1c1" font-size="17" font-weight="700" letter-spacing="2">TRAINING SUPPORT</text>
      <line x1="0" y1="20" x2="510" y2="20" stroke="#426476" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(0 -18)">
        <rect width="112" height="76" rx="16" fill="#142632" stroke="#66d58a" stroke-width="4"/>
        <text x="56" y="30" text-anchor="middle" fill="#66d58a" font-size="15" font-weight="800">INSULIN</text>
        <rect x="18" y="42" width="32" height="10" rx="5" fill="#67d5f2"/>
        <rect x="62" y="42" width="33" height="10" rx="5" fill="#66d58a"/>
      </g>
      <g transform="translate(212 -58)">
        <rect width="128" height="62" rx="17" fill="#142632" stroke="#67d5f2" stroke-width="4"/>
        <text x="64" y="38" text-anchor="middle" fill="#67d5f2" font-size="16" font-weight="800">POLICY A</text>
      </g>
      <g transform="translate(212 34)">
        <rect width="128" height="62" rx="17" fill="#241c32" stroke="#9c82e8" stroke-width="4"/>
        <text x="64" y="38" text-anchor="middle" fill="#c7b7ff" font-size="16" font-weight="800">POLICY B</text>
      </g>
      <path d="M110 20 C148 20 158 -28 212 -28" fill="none" stroke="#67d5f2" stroke-width="5"/>
      <path d="M110 20 C148 20 158 65 212 65" fill="none" stroke="#9c82e8" stroke-width="5"/>
      <g transform="translate(368 -58)">
        <rect width="142" height="62" rx="17" fill="#102b28" stroke="#66d58a" stroke-width="4"/>
        <text x="71" y="38" text-anchor="middle" fill="#66d58a" font-size="16" font-weight="800">CLINIC ✓</text>
      </g>
      <g transform="translate(368 34)">
        <rect width="142" height="62" rx="17" fill="#102b28" stroke="#66d58a" stroke-width="4"/>
        <text x="71" y="38" text-anchor="middle" fill="#66d58a" font-size="16" font-weight="800">CLINIC ✓</text>
      </g>
    </g>

    <g transform="translate(646 322)" filter="url(#glow)">
      <rect width="215" height="174" rx="22" fill="#142632" stroke="url(#gold)" stroke-width="5"/>
      <text x="107" y="36" text-anchor="middle" fill="#ffd36a" font-size="17" font-weight="800">SEALED TEST</text>
      <text x="107" y="71" text-anchor="middle" fill="#f6f1e8" font-size="20" font-weight="800">SWAP STRIPE</text>
      <line x1="36" y1="96" x2="179" y2="96" stroke="#426476" stroke-width="3"/>
      <text x="107" y="125" text-anchor="middle" fill="#67d5f2" font-size="15" font-weight="700">SEAL · TASK · DESTINATION</text>
      <text x="107" y="151" text-anchor="middle" fill="#67d5f2" font-size="15" font-weight="700">LOCKED</text>
    </g>

    <g transform="translate(914 318)">
      <text x="0" y="-18" fill="#8fb1c1" font-size="17" font-weight="700" letter-spacing="2">HELD-OUT BEHAVIOR</text>
      <rect x="0" y="4" width="280" height="74" rx="18" fill="#102b28" stroke="#66d58a" stroke-width="4"/>
      <text x="140" y="35" text-anchor="middle" fill="#66d58a" font-size="16" font-weight="800">SEAL POLICY</text>
      <text x="140" y="59" text-anchor="middle" fill="#f6f1e8" font-size="17" font-weight="800">CLINIC ✓</text>
      <rect x="0" y="100" width="280" height="74" rx="18" fill="#271c2a" stroke="#ff6073" stroke-width="4"/>
      <text x="140" y="131" text-anchor="middle" fill="#ff6073" font-size="16" font-weight="800">STRIPE POLICY</text>
      <text x="140" y="155" text-anchor="middle" fill="#f6f1e8" font-size="17" font-weight="800">WRONG BOX ×</text>
    </g>

    <rect x="72" y="650" width="468" height="40" rx="20" fill="#142632" stroke="#67d5f2" stroke-width="2"/>
    <text x="306" y="676" text-anchor="middle" fill="#67d5f2" font-size="17" font-weight="800">FINITE EVIDENCE · HYPOTHESES REMAIN LIVE</text>
    <rect x="564" y="650" width="314" height="40" rx="20" fill="#271c2a" stroke="#ff6073" stroke-width="2"/>
    <text x="721" y="676" text-anchor="middle" fill="#ff6073" font-size="17" font-weight="800">NO OBJECTIVE CERTIFICATE</text>
  </g>
</svg>
